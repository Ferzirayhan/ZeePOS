<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#0a7c72"/>
      <stop offset="100%" stop-color="#044e47"/>
    </linearGradient>
    <linearGradient id="receiptGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Stylized Z Symbol -->
  <path d="M 130 140 H 380 L 220 340 H 380 V 385 H 130 L 290 185 H 130 Z" fill="url(#zGrad)" />

  <!-- Receipt Icon Overlay on Bottom Right -->
  <g transform="translate(250, 240)">
    <path d="M 40 10 H 170 C 180 10 190 20 190 30 V 175 L 165 160 L 140 175 L 115 160 L 90 175 L 65 160 L 40 175 V 30 C 40 20 50 10 60 10 Z" fill="url(#receiptGrad)" />
    <!-- Receipt Content Lines -->
    <line x1="70" y1="50" x2="160" y2="50" stroke="#064e3b" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="80" x2="140" y2="80" stroke="#064e3b" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="110" x2="160" y2="110" stroke="#064e3b" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
